<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#28DAD4">
	<title>Coloron</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<canvas id="game" aria-label="Coloron game area"></canvas>

	<div class="hud hidden" id="hud">
		<button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
			<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
		</button>
		<div class="hud-score">
			<div class="score" id="score">0</div>
			<div class="hud-best" id="hudBest"></div>
		</div>
	</div>

	<div class="learn-to-play" id="learn">Tap the bars to change their color!</div>

	<div class="overlay start-game" id="startGame">
		<div class="menu-box" id="menuBox">
			<div class="logo-holder">
				<p class="logo" aria-label="Coloron"><span>C</span><span>o</span><span>l</span><span>o</span><span>r</span><span>o</span><span>n</span></p>
				<button class="play-button" id="playBtn" type="button">Play</button>
				<p class="hint">Hint: <span>Red</span> is always the starting color</p>
				<p class="menu-best" id="menuBest"></p>
			</div>

			<div class="how-to-play">
				<div class="section section-1">
					<h4>The bouncing ball changes color</h4>
					<div class="content">
						<div class="ball-demo bouncing" id="demoBall"></div>
					</div>
				</div>
				<div class="section section-2">
					<h4>Tap a bar to change its color (red, yellow, purple)</h4>
					<div class="content">
						<div class="bar bar-1 red" data-index="0"></div>
						<div class="bar bar-2 yellow" data-index="1"></div>
						<div class="bar bar-3" data-index="-1"></div>
					</div>
				</div>
				<div class="section section-3">
					<h4>Always match the colors of the ball and the bar</h4>
					<div class="content">
						<div class="ball-demo purple"></div>
						<div class="bar bar-4 purple"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="overlay stop-game hidden" id="stopGame">
		<div class="score-container" id="scoreBox">
			<h1>Coloron</h1>
			<div class="final-score" id="finalScore">0!</div>
			<div class="result" id="result"></div>
			<div class="final-best" id="finalBest"></div>
			<div class="buttons">
				<button class="play-again" id="retryBtn" type="button">Retry</button>
				<button class="main-menu" id="menuBtn" type="button">Menu</button>
			</div>
		</div>
	</div>

	<div class="overlay pause-screen hidden" id="pauseScreen">
		<div class="pause-box">
			<h2>Paused</h2>
			<button class="play-again" id="resumeBtn" type="button">Resume</button>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
